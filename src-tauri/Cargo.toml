[package]
name = "winui-toolbox"
version = "0.1.0"
description = "WinUI Toolbox —— 本地优先 Windows 工具箱"
authors = ["WinUI Toolbox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "winui_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
winreg = "0.52"
sysinfo = "0.30"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# 图像处理（AWMC 移植）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif", "ico", "qoi"] }
kamadak-exif = "0.6"

# 高级编码器（可选，编译失败时可降级）
oxipng = { version = "9", default-features = false, optional = true }

[features]
default = []
# 启用 OxiPNG（PNG 无损压缩优化）
advanced-codecs = ["oxipng"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
